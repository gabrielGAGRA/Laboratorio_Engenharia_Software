name: Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  python-quality-gate:
    name: Python Linting & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff Format Check
        run: ruff format --check app tests

      - name: Ruff Check
        run: ruff check app tests

      - name: Pyrefly Check
        run: pyrefly check

  frontend-quality-gate:
    name: Frontend Linting (Angular & TS 7 Oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TS 7 Oxlint
        run: npm run lint:ts

      - name: Angular ESLint
        run: npm run lint:angular
