[tool.ruff]
target-version = "py314"
extend-exclude = ["docs", "scripts"]

[tool.ruff.lint]
select = [
"B",      # bugbear
"I",      # isort
"F",      # pyflakes
"C901",   # complexity
"N",      # pep8-naming
"S",      # bandit
"PERF",   # perflint
"G",      # logging
"UP",     # pyupgrade
"TRY",    # exceptions
"SIM",    # simplifications
"D",      # docstrings
"TID",    # imports
"PL",     # pylint
"E4",     # PEP-8-imports
"E7",     # PEP-8-statements
"E9",     # PEP-8-runtime
"W505",   # docs line-length
"W605",   # escape
"RUF012", # mutable
"BLE",    # except
"C4",     # comprehensions
]
ignore = ["D101", "D102", "D103", "D107", "TRY003", "SIM108"]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SIM117", "PLC0415", "N803", "PLR2004", "TRY300", "PLR0913", "TID251"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.field_validator"]
extend-ignore-names = ["main", "_"]

# PEP8
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"


# Tests
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
branch = true
source = ["app.py"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true


# Zuban: Type checking
[tool.zuban]
strict = true
disallow_untyped_defs = true
warn_unreachable = true
allow_untyped_globals = false
check_untyped_defs = true
follow_untyped_imports = true
exclude_gitignore = true
exclude = ["tests"]