[tool.uv]
package = false



[tool.ruff]
target-version = "py315"
extend-exclude = ["docs", "local"]

[tool.ruff.lint]
select = [
# Estilo
"F",      # pyflakes
"E4",     # PEP-8-imports
"E7",     # PEP-8-statements
"E9",     # PEP-8-runtime
"W605",   # escape
"I",      # isort
"TID",    # imports
"W505",   # docs line-length
"TD",     # flake8-todos
# Convenções
"C901",   # complexity
"N",      # pep8-naming
"SIM",    # simplifications
"TRY",    # exceptions
"D",      # docstrings
"PLC",    # pylint
"PLE",    # pylint
"PLW",    # pylint
# Integridade
"UP",     # pyupgrade
"B",      # bugbear
"PERF",   # perflint
# Segurança
"S",      # bandit
# Lógica
"BLE",    # except
"C4",     # comprehensions
"RUF012", # mutable
# APIs
"ASYNC",  # flake8-async
"DTZ",    # flake8-datetime-timezone
"FAST",   # fastapi
"T20",    # flake8-print
"G",      # flake8-gedcom
"LOG",    # flake8-logging
"PTH",    # flake8-use-pathlib
"TC",     # flake8-type-checking
]


ignore = [
    "D101", "D102", "D103", "D105", "D107", # docstrings não obrigatórias
    "TRY003", # liberação de try sem else
    "SIM108", # libera if em vez de ternários
    "TD002",  # libera TODO sem autor obrigatório
    "TD003",  # libera TODO sem link obrigatórios
]

unfixable = ["B"]


[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # libera assert
    "S105", "S106", # libera senhas mock hardcodadas
    "SIM117", # libera vários context managers aninhados (with patch(...))
    "PLC0415", # libera imports dentro de funções de teste
    "N803", # libera quaisquer nomes de argumentos em fixtures
    "TRY300", # libera assert no try sem bloco de else
    "TID251", # libera apis banidas
    "T201"  # libera prints em teste
]


[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod", 
    "pydantic.field_validator", 
    "pydantic.model_validator"
]
extend-ignore-names = ["main", "_"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"



# Tests
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit",
    "integration",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["tests/*", "app/main.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true



# Zuban: Type checking
[tool.zuban]
strict = true
disallow_untyped_defs = true
warn_unreachable = true
allow_untyped_globals = false
check_untyped_defs = true
follow_untyped_imports = true
exclude_gitignore = true
exclude = ["tests"]